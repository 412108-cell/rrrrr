<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二分搜尋視覺化 - 明亮華麗版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --bg-main: #f8fafc;
        }

        body {
            background: var(--bg-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            color: #1e293b;
        }

        /* 明亮流動背景 */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #e0e7ff, #f8fafc);
            z-index: -1;
        }

        .animated-orb {
            position: absolute;
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #c7d2fe, #ddd6fe);
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.4;
            animation: orb-move 25s infinite alternate;
            z-index: -1;
        }

        @keyframes orb-move {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(110%, 110%); }
        }

        /* 數字格點設計 */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            perspective: 1000px;
        }

        .number-box {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            color: #475569;
        }

        .number-box:not(.excluded):hover {
            transform: translateZ(30px) scale(1.15);
            background: white;
            border-color: var(--primary);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        /* 被排除時的翻轉動畫 */
        .number-box.excluded {
            transform: rotateX(180deg) scale(0.85);
            opacity: 0.15;
            filter: grayscale(1) blur(1px);
            pointer-events: none;
            background: #f1f5f9;
        }

        .number-box.last-guess {
            animation: pulse-red 0.5s ease;
            background: #fee2e2;
            border-color: var(--danger);
            color: var(--danger);
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 成功時的效果 */
        .number-box.bingo {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            transform: scale(1.3) translateZ(50px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            z-index: 50;
            border-color: transparent;
        }

        /* 文字漸層 */
        .title-gradient {
            background: linear-gradient(to bottom right, #1e293b, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.02);
        }

        .success-banner {
            background: white;
            border: 1px solid rgba(255, 255, 255, 1);
            animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 500px) {
            .number-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
            .number-box { font-size: 0.9rem; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="animated-orb"></div>

    <div class="max-w-3xl w-full py-10">
        <!-- 標題區 -->
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black title-gradient mb-3 tracking-tighter">BINARY SEARCH</h1>
            <div class="inline-block px-4 py-1 rounded-full bg-white shadow-sm border border-slate-100 text-indigo-500 text-xs font-black tracking-widest uppercase">
                Visual Lab • Bright Edition
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <!-- 搜尋範圍 -->
            <div class="md:col-span-3 status-card p-6 rounded-[2.5rem] flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">目前搜尋範圍</p>
                    <div id="range-display" class="text-3xl font-mono font-black text-slate-700">1 — 100</div>
                </div>
                <div class="h-10 w-[1px] bg-slate-200"></div>
                <div class="text-right">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">嘗試次數</p>
                    <div id="guess-count" class="text-3xl font-mono font-black text-slate-700">0</div>
                </div>
            </div>
            
            <!-- 重設按鈕 -->
            <button id="quick-reset" class="status-card rounded-[2.5rem] flex items-center justify-center hover:bg-white transition-all group shadow-sm active:scale-95">
                <span class="text-slate-400 text-2xl font-bold group-hover:rotate-180 group-hover:text-indigo-500 transition-transform duration-700">↺</span>
            </button>
        </div>

        <!-- 提示語區 -->
        <div class="text-center mb-8 h-8">
            <p id="message" class="text-lg font-bold text-slate-500 transition-all"></p>
        </div>

        <!-- 主遊戲矩陣 -->
        <div id="grid-container" class="number-grid mb-10">
            <!-- 由 JS 生成 -->
        </div>

        <!-- 勝利結算畫面 -->
        <div id="end-overlay" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-white/60 backdrop-blur-md">
            <div class="success-banner max-w-lg w-full p-12 rounded-[3.5rem] text-center">
                <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-8 border border-emerald-100">
                    <span class="text-4xl">👑</span>
                </div>
                <h2 class="text-4xl font-black text-slate-800 mb-4 tracking-tight">搜尋完成！</h2>
                <p id="final-stats" class="text-slate-500 text-lg mb-10 leading-relaxed"></p>
                <button id="reset-btn" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 hover:shadow-xl hover:scale-[1.02] active:scale-95 transition-all">
                    重新開始實驗
                </button>
            </div>
        </div>
    </div>

    <script>
        let targetNumber, low, high, attempts, isGameOver;

        const gridContainer = document.getElementById('grid-container');
        const messageEl = document.getElementById('message');
        const rangeDisplay = document.getElementById('range-display');
        const guessCountEl = document.getElementById('guess-count');
        const endOverlay = document.getElementById('end-overlay');
        const finalStats = document.getElementById('final-stats');
        const resetBtn = document.getElementById('reset-btn');
        const quickReset = document.getElementById('quick-reset');

        function initGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            low = 1;
            high = 100;
            attempts = 0;
            isGameOver = false;
            
            updateMessage("請點選格點中的數字...", "text-slate-400");
            rangeDisplay.textContent = "1 — 100";
            guessCountEl.textContent = "0";
            endOverlay.classList.add('hidden');
            
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const div = document.createElement('div');
                div.id = `num-${i}`;
                div.className = 'number-box';
                div.innerHTML = `<span>${i}</span>`;
                div.onclick = () => handleGuess(i);
                gridContainer.appendChild(div);
            }
        }

        function handleGuess(guess) {
            if (isGameOver || guess < low || guess > high) return;

            attempts++;
            const el = document.getElementById(`num-${guess}`);

            if (guess === targetNumber) {
                isGameOver = true;
                el.classList.add('bingo');
                celebrate();
                showEndScreen();
            } else {
                el.classList.add('last-guess');
                if (guess < targetNumber) {
                    updateMessage(`太小了 ⬆️ 答案在 ${guess} 之後`, "text-blue-500");
                    low = guess + 1;
                } else {
                    updateMessage(`太大了 ⬇️ 答案在 ${guess} 之前`, "text-orange-500");
                    high = guess - 1;
                }
                updateGrid();
            }
        }

        function updateGrid() {
            for (let i = 1; i <= 100; i++) {
                const el = document.getElementById(`num-${i}`);
                if (i < low || i > high) {
                    el.classList.add('excluded');
                }
            }
            rangeDisplay.textContent = `${low} — ${high}`;
            guessCountEl.textContent = attempts;
        }

        function updateMessage(msg, colorClass) {
            messageEl.textContent = msg;
            messageEl.className = `text-lg font-bold tracking-tight transition-all ${colorClass}`;
        }

        function celebrate() {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#6366f1', '#10b981']
                });
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#6366f1', '#10b981']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function showEndScreen() {
            setTimeout(() => {
                finalStats.innerHTML = `目標數字是 <span class="text-indigo-600 font-black">${targetNumber}</span>。<br>在 <span class="text-slate-800 font-black">${attempts}</span> 次嘗試中成功找到！`;
                endOverlay.classList.remove('hidden');
            }, 1000);
        }

        resetBtn.onclick = initGame;
        quickReset.onclick = initGame;

        window.onload = initGame;
    </script>
</body>
</html>
